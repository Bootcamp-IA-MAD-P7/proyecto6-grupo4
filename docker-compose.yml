services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: laliga
      POSTGRES_PASSWORD: laliga
      POSTGRES_DB: laliga
    ports:
      - "5432:5432"
    volumes:
      - laliga_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laliga"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://laliga:laliga@postgres:5432/laliga
      AUTH_SECRET_KEY: local-dev-secret-key-change-in-production
      CORS_ORIGINS: http://localhost:5173,http://localhost:8000
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  laliga_pg_data:
